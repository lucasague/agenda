<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#2e2520; --mesa2:#4a3a30;
  --papel:#fbf7ec; --papel-sombra:#e8e0cc; --linea:#d6e0ec; --margen:#e6a3a3;
  --tinta:#2a2a3a; --tenue:#8b8472;
  --im:#c9a227; --im-t:#3a2c00;
  --sta:#d6248a; --sta-t:#fff;
  --argoz:#2c6bd6; --argoz-t:#fff;
  --admin:#d4d4d4; --admin-t:#333;
  --personal:#ffffff; --personal-t:#2a2a3a;
  --rojo:#d0262b; --rojo-t:#fff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:radial-gradient(ellipse at 50% 30%, var(--mesa2), var(--mesa) 70%);
  color:var(--tinta); font-family:'Kalam',cursive; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:14px 16px 24px;
}
button{font:inherit;cursor:pointer}

/* ---------- barra superior ---------- */
.barra{width:min(1400px,100%);display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#f3e9d6;margin-bottom:10px}
.barra h1{font-family:'Caveat',cursive;font-size:38px;margin:0;line-height:1}
.semana{font-family:'Caveat',cursive;font-size:26px;opacity:.9}
.nav{display:flex;gap:6px;margin-left:auto}
.nav button{background:#f3e9d6;color:var(--mesa);border:0;border-radius:8px;padding:4px 12px;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.nav button:hover{background:#fff}
.leyenda{display:flex;gap:6px;flex-wrap:wrap;width:min(1400px,100%);margin-bottom:10px}
.leyenda button{font-size:13px;padding:1px 9px;border-radius:4px;border:0;user-select:none;transition:opacity .15s}
.leyenda button.apagado{opacity:.3;text-decoration:line-through}

/* ---------- libro ---------- */
.libro{
  position:relative;width:min(1400px,100%);height:max(560px,66vh);
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.5));
}
.pagina{position:relative;background:var(--papel);display:grid;grid-template-rows:1fr 1fr 1fr;padding:18px 22px;overflow:hidden}
.pagina.izq{border-radius:10px 2px 2px 10px;padding-right:38px;
  background:linear-gradient(to left, rgba(0,0,0,.13), rgba(0,0,0,0) 46px), var(--papel)}
.pagina.der{border-radius:2px 10px 10px 2px;padding-left:38px;
  background:linear-gradient(to right, rgba(0,0,0,.13), rgba(0,0,0,0) 46px), var(--papel)}
.pagina.der .fila3{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
.pagina.der .fila3 .dia + .dia{border-left:1.5px dashed var(--papel-sombra);padding-left:12px}
.fila3 .dia:first-child{padding-right:12px}

/* anillas */
.anillas{position:absolute;left:50%;top:14px;bottom:14px;transform:translateX(-50%);
  display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;z-index:3}
.anilla{width:46px;height:9px;border-radius:6px;position:relative;
  background:linear-gradient(#f4f4f4,#9a9a9a 55%,#d8d8d8);box-shadow:0 2px 2px rgba(0,0,0,.35)}
.anilla::before,.anilla::after{content:"";position:absolute;top:1px;width:7px;height:7px;border-radius:50%;background:#3b302a}
.anilla::before{left:-3px}.anilla::after{right:-3px}

/* esquinas para pasar página */
.esquina{position:absolute;bottom:0;width:58px;height:58px;z-index:4;border:0;padding:0;background:transparent}
.esquina.izq{left:0;border-bottom-left-radius:10px;
  background:linear-gradient(45deg, var(--papel-sombra) 0 48%, rgba(0,0,0,.18) 50%, transparent 53%)}
.esquina.der{right:0;border-bottom-right-radius:10px;
  background:linear-gradient(-45deg, var(--papel-sombra) 0 48%, rgba(0,0,0,.18) 50%, transparent 53%)}
.esquina:hover,.esquina.tentando{width:74px;height:74px}
.esquina span{position:absolute;bottom:6px;font-family:'Caveat',cursive;font-size:20px;color:var(--tenue)}
.esquina.izq span{left:9px}.esquina.der span{right:9px}

/* ---------- día (vista semana) ---------- */
.dia{display:flex;flex-direction:column;min-height:0;padding:4px 0 6px;border-bottom:1.5px solid var(--papel-sombra)}
.pagina > .dia:nth-child(3),.fila3 .dia{border-bottom:0}
.cab{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--margen);padding-bottom:1px;margin-bottom:3px}
.cab .num{font-family:'Caveat',cursive;font-weight:700;font-size:34px;line-height:.9}
.cab .nombre{font-family:'Caveat',cursive;font-size:24px;line-height:1}
.cab .mes{font-size:12px;color:var(--tenue)}
.cab .ir{display:flex;align-items:baseline;gap:8px;border:0;background:transparent;padding:0 4px 0 0;color:inherit;border-radius:6px}
.cab .ir:hover{background:var(--papel-sombra)}
.cab .mas{margin-left:auto;border:0;background:transparent;color:var(--tenue);font-size:22px;line-height:1;padding:0 4px;border-radius:6px}
.cab .mas:hover{background:var(--papel-sombra);color:var(--tinta)}
.dia.hoy .cab .num{color:#fff;background:var(--rojo);border-radius:50%;padding:2px 8px 0;font-size:28px}
.dia.finde .cab .num{font-size:28px}.dia.finde .cab .nombre{font-size:21px}
.sobre{background:rgba(44,107,214,.06);box-shadow:inset 0 0 0 2px rgba(44,107,214,.28);border-radius:6px}

/* rutina fija en la vista semana */
.rutinas{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--tenue);margin:0 2px 2px}
.rut{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.rut i{width:11px;height:11px;border-radius:2px;border:1.4px solid var(--tenue);display:inline-block;font-style:normal;font-size:10px;line-height:9px;text-align:center}
.rut.fija{cursor:default}
.t-rutina.fija{cursor:default;border-style:solid;border-color:#ddd3bd}
.rut.hecha{text-decoration:line-through}
.rut.hecha i{background:var(--tenue);color:var(--papel)}
.rut.hecha i::after{content:"✓"}

.tareas{list-style:none;margin:0;padding:0 2px 6px;flex:1;min-height:30px;overflow-y:auto;
  background:repeating-linear-gradient(to bottom, transparent 0 27px, var(--linea) 27px 28px)}
.tareas::-webkit-scrollbar{width:6px}.tareas::-webkit-scrollbar-thumb{background:var(--papel-sombra);border-radius:3px}

/* ---------- tarea ---------- */
.tarea{display:flex;align-items:flex-start;gap:6px;margin:2px 0 3px;padding:2px 8px 2px 5px;border-radius:4px;
  font-size:15px;line-height:1.35;cursor:grab;user-select:none;
  box-shadow:0 1px 0 rgba(0,0,0,.12);transform:rotate(-.25deg)}
.tarea:nth-child(even){transform:rotate(.3deg)}
.tarea:active{cursor:grabbing}
.tarea .chk{flex:none;width:15px;height:15px;margin-top:3px;border-radius:50%;border:1.6px solid currentColor;background:transparent;padding:0;opacity:.75;color:inherit}
.tarea .txt{flex:1;word-break:break-word}
.tarea .hora{font-weight:700;margin-right:4px}
.tarea.hecha .txt{text-decoration:line-through;opacity:.55}
.tarea.hecha .chk{background:currentColor}
.tarea.fantasma{opacity:.3}
.t-im{background:var(--im);color:var(--im-t)}
.t-sta{background:var(--sta);color:var(--sta-t)}
.t-argoz{background:var(--argoz);color:var(--argoz-t)}
.t-admin{background:var(--admin);color:var(--admin-t)}
.t-personal{background:var(--personal);color:var(--personal-t);box-shadow:0 0 0 1px #cfc6b2, 0 1px 0 rgba(0,0,0,.12)}
.t-rojo{background:var(--rojo);color:var(--rojo-t);font-weight:700}
.t-rutina{background:transparent;color:var(--tinta);box-shadow:none;border:1.4px dashed #b9ae95;cursor:pointer;font-style:italic}
.marca{height:4px;border-radius:2px;background:var(--argoz);margin:2px 0;list-style:none}

/* ---------- vista día ---------- */
.pagina.pdia{display:flex;flex-direction:column}

/* tareas de los días laborables a doble columna sobre las líneas */
.pagina > .dia .tareas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px;align-content:start}

/* casillas llenas: títulos a una línea, y si no basta, letra menor */
.tarea{min-width:0}
.tareas.apretada .tarea{margin:1px 0}
.tareas.apretada .txt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tareas.muy-apretada .tarea{font-size:12.5px;padding-top:0;padding-bottom:0;margin:0}
.tareas.muy-apretada .tarea .chk{width:12px;height:12px;margin-top:2px}
.franja .tareas.apretada{flex-wrap:nowrap}
.franja .tareas.apretada .tarea{flex:1 1 0}

/* paso de página en 3D: una hoja gira sobre las anillas */
.libro{perspective:2600px}
.anillas{z-index:7}
.tapa,.hoja{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
.tapa{z-index:4}
.tapa > .pagina,.cara > .pagina{position:absolute;inset:0;height:100%}
.hoja{z-index:6;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.42,.08,.28,1)}
.hoja.adelante{left:50%;transform-origin:left center}
.hoja.atras{left:0;transform-origin:right center}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cara.dorso{transform:rotateY(180deg)}
.cara::after{content:"";position:absolute;inset:0;opacity:0;pointer-events:none;animation:luz .75s ease-in-out}
.hoja.adelante .frente::after,.hoja.atras .dorso::after{background:linear-gradient(to right, rgba(0,0,0,.35), rgba(0,0,0,0) 60%)}
.hoja.adelante .dorso::after,.hoja.atras .frente::after{background:linear-gradient(to left, rgba(0,0,0,.35), rgba(0,0,0,0) 60%)}
@keyframes luz{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.tapa::after{content:"";position:absolute;inset:0;pointer-events:none;animation:sombraTapa .75s ease-in-out;opacity:0}
.tapa.izq::after{background:linear-gradient(to left, rgba(0,0,0,.28), rgba(0,0,0,0) 70%)}
.tapa.der::after{background:linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,0) 70%)}
@keyframes sombraTapa{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
.cabdia{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--margen);margin-bottom:4px}
.cabdia .num{font-family:'Caveat',cursive;font-weight:700;font-size:46px;line-height:.9}
.cabdia .nombre{font-family:'Caveat',cursive;font-size:32px}
.cabdia .mes{color:var(--tenue)}
.cabdia button{margin-left:auto;border:0;background:var(--papel-sombra);border-radius:6px;padding:1px 10px;font-size:14px}
.horas{flex:1;display:grid;grid-auto-rows:minmax(0,1fr);min-height:0}
.franja{display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid var(--linea);min-height:0}
.franja .h{font-family:'Caveat',cursive;font-size:20px;color:var(--tenue);border-right:1.5px solid var(--margen);padding-right:6px;text-align:right;line-height:1.3}
.franja .tareas{background:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 6px;padding:1px 6px;min-height:0}
.franja .tarea{margin:2px 0}
.franja .marca{width:4px;height:22px}
.sinhora{flex:0 0 32%;display:flex;flex-direction:column;margin-top:8px;min-height:0}

/* ---------- notas ---------- */
.notas{width:min(1400px,100%);margin-top:22px;background:#fff8c9;border-radius:4px;padding:10px 18px 14px;
  box-shadow:0 10px 18px rgba(0,0,0,.45);transform:rotate(-.3deg);display:flex;flex-direction:column;min-height:150px}
.notas .cab{border-bottom-color:#e2c96b}
.notas .nombre{font-size:28px}
.notas .tareas{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 8px;
  background:repeating-linear-gradient(to bottom, transparent 0 27px, #eadf9e 27px 28px);min-height:84px}
.notas .tarea{max-width:340px}
.notas .marca{width:4px;height:24px}

.pie{width:min(1400px,100%);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#cbbda5}
.pie span{margin-right:auto}
.pie button{background:transparent;border:1px solid #6b5a4c;color:#cbbda5;border-radius:6px;padding:2px 10px;font-size:13px}
.pie button:hover{color:#fff;border-color:#cbbda5}

/* ---------- editor ---------- */
.velo{position:fixed;inset:0;background:rgba(20,14,10,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.velo.abierto{display:flex}
.editor{background:var(--papel);border-radius:8px;padding:16px 18px;width:min(440px,100%);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.editor h2{font-family:'Caveat',cursive;margin:0 0 8px;font-size:28px}
.editor textarea{width:100%;font:inherit;font-size:17px;border:0;border-bottom:1.5px solid var(--margen);background:repeating-linear-gradient(to bottom, transparent 0 27px, var(--linea) 27px 28px);
  line-height:28px;resize:vertical;min-height:58px;outline:none;color:var(--tinta)}
.editor label{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--tenue)}
.editor input[type=time]{font:inherit;border:1px solid var(--papel-sombra);border-radius:5px;background:#fff;padding:1px 6px}
.temas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.temas button{border:0;border-radius:5px;padding:3px 10px;font-size:14px;outline:2px solid transparent;outline-offset:2px}
.temas button.sel{outline-color:var(--tinta)}
.acciones{display:flex;gap:8px;justify-content:flex-end}
.acciones button{border:0;border-radius:6px;padding:5px 14px;font-size:15px}
.acciones .guardar{background:var(--tinta);color:#fff}
.acciones .cancelar{background:var(--papel-sombra)}
.acciones .borrar{background:transparent;color:var(--rojo);margin-right:auto}

/* paso de página */
@keyframes pasarAdelante{from{opacity:.2;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pasarAtras{from{opacity:.2;transform:translateX(-26px)}to{opacity:1;transform:none}}
.libro.adelante .pagina{animation:pasarAdelante .28s ease-out}
.libro.atras .pagina{animation:pasarAtras .28s ease-out}

@media (max-width:760px){
  .libro{grid-template-columns:1fr;height:auto}
  .pagina{min-height:620px}
  .pagina.izq,.pagina.der{border-radius:10px;padding:16px 18px;background:var(--papel)}
  .pagina.der{margin-top:14px}
  .anillas{display:none}
  .semana{font-size:21px}
}
</style>
</head>
<body>

<div class="barra">
  <h1>Agenda</h1>
  <div class="semana" id="titulo"></div>
  <div class="nav">
    <button id="ant" title="Anterior (←)">‹</button>
    <button id="hoy">Hoy</button>
    <button id="sig" title="Siguiente (→)">›</button>
  </div>
</div>
<div class="leyenda" id="leyenda"></div>

<!-- Vista semana: LMX a la izquierda, JV y S|D a la derecha -->
<div class="libro" id="libroSemana">
  <section class="pagina izq">
    <div class="dia" data-zona="dia" data-dia="0"></div>
    <div class="dia" data-zona="dia" data-dia="1"></div>
    <div class="dia" data-zona="dia" data-dia="2"></div>
    <button class="esquina izq" id="esqIzq" title="Semana anterior"><span>‹</span></button>
  </section>
  <section class="pagina der">
    <div class="dia" data-zona="dia" data-dia="3"></div>
    <div class="dia" data-zona="dia" data-dia="4"></div>
    <div class="fila3">
      <div class="dia finde" data-zona="dia" data-dia="5"></div>
      <div class="dia finde" data-zona="dia" data-dia="6"></div>
    </div>
    <button class="esquina der" id="esqDer" title="Semana siguiente"><span>›</span></button>
  </section>
  <div class="anillas"></div>
</div>

<!-- Vista día: horario de 3:00 a 22:00 -->
<div class="libro vdia" id="libroDia" hidden>
  <section class="pagina izq pdia">
    <div class="cabdia"><span class="num" id="dNum"></span><span class="nombre" id="dNombre"></span><span class="mes" id="dMes"></span><button id="volver">‹ Semana</button></div>
    <div class="horas" id="horasIzq"></div>
  </section>
  <section class="pagina der pdia">
    <div class="horas" id="horasDer"></div>
    <div class="sinhora" data-zona="sinhora">
      <div class="cab"><span class="nombre">Sin hora</span><button class="mas" title="Añadir">+</button></div>
      <ul class="tareas"></ul>
    </div>
  </section>
  <div class="anillas"></div>
</div>

<div class="notas" id="notas" data-zona="notas" data-fecha="">
  <div class="cab"><span class="nombre">Notas · sin día</span><button class="mas" title="Añadir">+</button></div>
  <ul class="tareas"></ul>
</div>

<div class="pie">
  <span>Clic en un día para ver su horario · doble clic en un hueco para apuntar · arrastra para mover</span>
  <button id="nube">☁ Conectar</button>
  <button id="exportar">Guardar copia</button>
  <button id="importar">Cargar copia</button>
  <input type="file" id="fichero" accept="application/json" hidden>
</div>

<div class="velo" id="veloToken">
  <div class="editor">
    <h2>Conectar la agenda</h2>
    <p style="margin:0 0 8px;font-size:14px;color:var(--tenue)">Pega el token de GitHub con acceso al repo <b>agenda-datos</b>. Se guarda solo en este navegador.</p>
    <input type="password" id="tokTexto" style="width:100%;font:inherit;padding:4px 8px;border:1px solid var(--papel-sombra);border-radius:5px" placeholder="github_pat_…">
    <p id="tokError" style="color:var(--rojo);font-size:14px;min-height:1em;margin:6px 0"></p>
    <div class="acciones">
      <button class="cancelar" id="tokCancelar">Cancelar</button>
      <button class="guardar" id="tokGuardar">Conectar</button>
    </div>
  </div>
</div>

<div class="velo" id="velo">
  <div class="editor">
    <h2 id="edTitulo">Nueva tarea</h2>
    <textarea id="edTexto" placeholder="Qué hay que hacer…"></textarea>
    <label>Hora <input type="time" id="edHora"> <small>(opcional)</small></label>
    <div class="temas" id="edTemas"></div>
    <div class="acciones">
      <button class="borrar" id="edBorrar">Borrar</button>
      <button class="cancelar" id="edCancelar">Cancelar</button>
      <button class="guardar" id="edGuardar">Guardar</button>
    </div>
  </div>
</div>

<script>
const TEMAS = [
  {id:'im', nombre:'IM'},
  {id:'sta', nombre:'STA'},
  {id:'argoz', nombre:'Argoz'},
  {id:'admin', nombre:'Administración'},
  {id:'personal', nombre:'Personal'},
  {id:'rojo', nombre:'Importante'},
];
// Lo fijo, en la cabecera de cada día; se marca y tacha por fecha. `dias`: 0 = lunes … 6 = domingo (sin `dias`, todos)
const RUTINA = [
  {id:'despertar',     hora:'03:45', texto:'Despertador'},
  {id:'contemplativa', hora:'04:00', texto:'Hora contemplativa', corto:'Contemplativa'},
  {id:'oracion',       hora:'06:37', texto:'Oración de la mañana', corto:'Oración', dias:[0,1,2,3,4]},
  {id:'taekwondo',     hora:'09:00', texto:'Taekwondo', dias:[4]},
  {id:'plan-gloria',   hora:'10:30', texto:'Plan Gloria', dias:[4]},
  {id:'recoger',       hora:'11:45', texto:'Recoger a los niños', corto:'Recoger niños', dias:[0,1,3]},
  {id:'intercambio',   hora:'13:00', texto:'Intercambio familiar', corto:'Intercambio', dias:[2]},
  {id:'recoger-x',     hora:'13:30', texto:'Recoger a los niños', corto:'Recoger niños', dias:[2]},
  {id:'plan-diego',    hora:'14:00', texto:'Plan Diego', dias:[1]},
  {id:'plan-jose',     hora:'14:00', texto:'Plan José', dias:[3]},
];
RUTINA.forEach(r => { r.etiqueta = (+r.hora.slice(0,2)) + ':' + r.hora.slice(3); r.corto = r.corto || r.texto; r.marcable = true; });
const rutinaDe = fecha => RUTINA.filter(r => !r.dias || r.dias.includes(diaSemana(deIso(fecha))));
const HORAS_IZQ = [3,4,5,6,7,8,9,10,11];
const HORAS_DER = [12,13,14,15,16,17,18,19,20];
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CLAVE = 'agenda-lucas-v1';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const deIso = s => new Date(s + 'T12:00');
const lunesDe = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const masDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diaSemana = d => (d.getDay()+6)%7;
const hh = h => String(h).padStart(2,'0');
const horaBonita = s => s ? (+s.slice(0,2)) + ':' + s.slice(3) : '';
function semanaISO(d){
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  x.setUTCDate(x.getUTCDate() + 4 - (x.getUTCDay() || 7));
  return Math.ceil(((x - Date.UTC(x.getUTCFullYear(),0,1)) / 864e5 + 1) / 7);
}

const completar = s => { s.rutina = s.rutina || {}; s.borradas = s.borradas || []; return s; };
function cargar(){
  try {
    const s = JSON.parse(localStorage.getItem(CLAVE));
    if (s && Array.isArray(s.tareas)) return completar(s);
  } catch(e){}
  return {tareas:[], rutina:{}, borradas:[]};
}
function guardarLocal(){ try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch(e){} }
function guardar(){ guardarLocal(); pendiente = true; clearTimeout(subidaProgramada); subidaProgramada = setTimeout(sincronizar, 700); }
const tocar = t => { t.mod = Date.now(); };

/* ---------- nube: datos.json del repo privado lucasague/agenda-datos ---------- */
const API = 'https://api.github.com/repos/lucasague/agenda-datos/contents/datos.json';
const CLAVE_TOKEN = 'agenda-token';
let token = ''; try { token = localStorage.getItem(CLAVE_TOKEN) || ''; } catch(e){}
let pendiente = false, subidaProgramada = null, sincronizando = false;
const rutinaPendiente = new Set();

const b64aTexto = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
function textoAb64(s){
  const bytes = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const cabeceras = () => ({Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'});

async function leerNube(){
  const r = await fetch(API + '?t=' + Date.now(), {headers:cabeceras(), cache:'no-store'});
  if (!r.ok) throw new Error('lectura ' + r.status);
  const j = await r.json();
  return {datos:completar(JSON.parse(b64aTexto(j.content))), sha:j.sha};
}
function mezclar(nube, local){
  const borradas = [...new Set([...nube.borradas, ...local.borradas])];
  const porId = new Map(nube.tareas.map(t => [t.id, t]));
  for (const t of local.tareas){
    const n = porId.get(t.id);
    if (!n || (t.mod || 0) > (n.mod || 0)) porId.set(t.id, t);
  }
  const rutina = JSON.parse(JSON.stringify(nube.rutina));
  for (const k of rutinaPendiente){
    const [f, id] = k.split('|');
    rutina[f] = rutina[f] || {};
    rutina[f][id] = !!(local.rutina[f] && local.rutina[f][id]);
  }
  return {tareas:[...porId.values()].filter(t => !borradas.includes(t.id)), rutina, borradas};
}
async function sincronizar(){
  // Con el editor abierto o arrastrando no se toca `estado`: la tarea en mano quedaría huérfana
  if (!token || sincronizando || $('#velo').classList.contains('abierto') || arrastrando) return;
  sincronizando = true; avisoNube('…');
  try {
    for (let intento = 0; intento < 4; intento++){
      const {datos, sha} = await leerNube();
      estado = mezclar(datos, estado);
      guardarLocal();
      if (!pendiente) break;
      const r = await fetch(API, {method:'PUT', headers:cabeceras(), body:JSON.stringify({
        message:'agenda: cambios desde la web', sha, content:textoAb64(JSON.stringify(estado, null, 1))})});
      if (r.ok){ pendiente = false; rutinaPendiente.clear(); break; }
      if (r.status !== 409 && r.status !== 422) throw new Error('escritura ' + r.status);
    }
    avisoNube(pendiente ? 'error' : 'ok');
    pintar();
  } catch(err){
    console.error(err); avisoNube('error');
  } finally { sincronizando = false; }
}
function avisoNube(s){
  const el = $('#nube');
  el.textContent = !token ? '☁ Conectar' : s === 'ok' ? '☁ Al día' : s === 'error' ? '☁ Sin conexión (reintentar)' : '☁ Sincronizando…';
}

let estado = cargar();
let modo = 'semana';
let lunes = lunesDe(new Date());
let diaActual = iso(new Date());
let ultimoTema = 'personal';

const $ = s => document.querySelector(s);
const rutinaHecha = (fecha, id) => !!(estado.rutina[fecha] && estado.rutina[fecha][id]);

/* ---------- maquetación fija ---------- */
// La leyenda filtra: clic oculta o muestra un tema; doble clic deja solo ese (o vuelve a todos)
const CLAVE_OCULTOS = 'agenda-ocultos';
let ocultos = new Set();
try { ocultos = new Set(JSON.parse(localStorage.getItem(CLAVE_OCULTOS) || '[]')); } catch(e){}
function pintarLeyenda(){
  $('#leyenda').innerHTML = TEMAS.map(t =>
    `<button class="t-${t.id}${ocultos.has(t.id) ? ' apagado' : ''}" data-tema="${t.id}" title="Clic: ocultar/mostrar · doble clic: solo este">${t.nombre}</button>`).join('');
}
function filtrar(nuevos){
  ocultos = nuevos;
  try { localStorage.setItem(CLAVE_OCULTOS, JSON.stringify([...ocultos])); } catch(e){}
  pintarLeyenda(); pintar();
}
$('#leyenda').addEventListener('click', e => {
  const b = e.target.closest('[data-tema]'); if (!b) return;
  const n = new Set(ocultos);
  n.has(b.dataset.tema) ? n.delete(b.dataset.tema) : n.add(b.dataset.tema);
  filtrar(n);
});
$('#leyenda').addEventListener('dblclick', e => {
  const b = e.target.closest('[data-tema]'); if (!b) return;
  const soloEste = ocultos.size === TEMAS.length - 1 && !ocultos.has(b.dataset.tema);
  filtrar(soloEste ? new Set() : new Set(TEMAS.map(t => t.id).filter(id => id !== b.dataset.tema)));
});
pintarLeyenda();
document.querySelectorAll('.anillas').forEach(a => a.innerHTML = '<div class="anilla"></div>'.repeat(16));
document.querySelectorAll('#libroSemana .dia').forEach(el => el.innerHTML =
  '<div class="cab"><button class="ir" title="Ver el horario del día"><span class="num"></span><span class="nombre"></span><span class="mes"></span></button><button class="mas" title="Añadir">+</button></div>' +
  '<div class="rutinas"></div><ul class="tareas"></ul>');
const franjas = (horas) => horas.map(h =>
  `<div class="franja" data-zona="franja" data-h="${hh(h)}"><span class="h">${h}:00</span><ul class="tareas"></ul></div>`).join('');
$('#horasIzq').innerHTML = franjas(HORAS_IZQ);
$('#horasDer').innerHTML = franjas(HORAS_DER);

/* ---------- pintar ---------- */
function tareasDe(fecha){
  return estado.tareas.filter(t => (t.fecha || '') === fecha);
}
const porOrden = (a, b) => a.orden - b.orden;
const porHora = (a, b) => (a.hora || '99').localeCompare(b.hora || '99') || a.orden - b.orden;

function chip(t, conHora){
  const li = document.createElement('li');
  li.className = `tarea t-${t.tema}` + (t.hecha ? ' hecha' : '');
  li.draggable = true;
  li.dataset.id = t.id;
  li.title = t.texto + (t.por ? ' · apuntada por ' + t.por : '');
  li.innerHTML = '<button class="chk" title="Hecha"></button><span class="txt"></span>';
  const txt = li.querySelector('.txt');
  if (conHora && t.hora){ const h = document.createElement('span'); h.className = 'hora'; h.textContent = horaBonita(t.hora); txt.appendChild(h); }
  txt.append(t.texto);
  return li;
}
function chipRutina(fecha, r){
  const li = document.createElement('li');
  const hora = `<span class="hora">${r.etiqueta}</span>`;
  if (!r.marcable){
    li.className = 'tarea t-rutina fija';
    li.innerHTML = `<span class="txt">${hora}${r.texto}</span>`;
    return li;
  }
  li.className = 'tarea t-rutina' + (rutinaHecha(fecha, r.id) ? ' hecha' : '');
  li.dataset.rut = r.id; li.dataset.fecha = fecha;
  li.innerHTML = `<button class="chk" title="Hecha"></button><span class="txt">${hora}${r.texto}</span>`;
  return li;
}
function llenar(ul, lista, conHora){
  ul.innerHTML = '';
  lista.filter(t => !ocultos.has(t.tema)).forEach(t => ul.appendChild(chip(t, conHora)));
}

const libroVisible = () => $('#libroSemana').hidden ? $('#libroDia') : $('#libroSemana');
const movil = () => matchMedia('(max-width:760px)').matches;

function pintar(direccion){
  quitarHoja();
  const viejo = direccion && !movil() ? foto(libroVisible()) : null;
  const libro = modo === 'semana' ? $('#libroSemana') : $('#libroDia');
  $('#libroSemana').hidden = modo !== 'semana';
  $('#libroDia').hidden = modo !== 'dia';
  if (modo === 'semana') pintarSemana(); else pintarDia();
  llenar($('#notas .tareas'), tareasDe('').sort(porOrden), false);
  libro.querySelectorAll('.tareas').forEach(ajustar);
  if (!direccion) return;
  if (viejo){ pasarHoja(libro, viejo, direccion); return; }
  libro.classList.remove('adelante','atras'); void libro.offsetWidth;
  libro.classList.add(direccion > 0 ? 'adelante' : 'atras');
}

// Si una casilla no cabe, las tareas pasan a una línea con puntos suspensivos y, si aún no cabe, a letra más pequeña
function ajustar(ul){
  ul.classList.remove('apretada', 'muy-apretada');
  const desborda = () => ul.scrollHeight > ul.clientHeight + 1;
  if (!ul.clientHeight || !desborda()) return;
  ul.classList.add('apretada');
  if (desborda()) ul.classList.add('muy-apretada');
}
let reajuste = null;
addEventListener('resize', () => { clearTimeout(reajuste); reajuste = setTimeout(() => document.querySelectorAll('.tareas').forEach(ajustar), 150); });

/* ---------- paso de página ---------- */
// Copia muda de las dos páginas: sin ids ni zonas, para que nada la confunda con las de verdad
function foto(libro){
  const [izq, der] = libro.querySelectorAll(':scope > .pagina');
  const limpia = p => {
    const c = p.cloneNode(true);
    c.querySelectorAll('[id],[data-zona],[data-dia],[data-id],[data-rut]').forEach(n =>
      ['id','data-zona','data-dia','data-id','data-rut'].forEach(a => n.removeAttribute(a)));
    c.querySelectorAll('.esquina').forEach(n => n.remove());
    return c;
  };
  return {izq:limpia(izq), der:limpia(der)};
}
let hojaEnCurso = null;
function quitarHoja(){
  if (!hojaEnCurso) return;
  clearTimeout(hojaEnCurso.t);
  hojaEnCurso.nodos.forEach(n => n.remove());
  hojaEnCurso = null;
}
function pasarHoja(libro, viejo, dir){
  const nuevo = foto(libro);
  const adelante = dir > 0;
  // Debajo de la hoja que gira sigue viéndose la página vieja del lado del que sale
  const tapa = document.createElement('div');
  tapa.className = 'tapa ' + (adelante ? 'izq' : 'der');
  tapa.style.left = adelante ? '0' : '50%';
  tapa.appendChild(adelante ? viejo.izq : viejo.der);
  const hoja = document.createElement('div');
  hoja.className = 'hoja ' + (adelante ? 'adelante' : 'atras');
  const frente = document.createElement('div'); frente.className = 'cara frente';
  const dorso = document.createElement('div'); dorso.className = 'cara dorso';
  frente.appendChild(adelante ? viejo.der : viejo.izq);
  dorso.appendChild(adelante ? nuevo.izq : nuevo.der);
  hoja.append(frente, dorso);
  libro.append(tapa, hoja);
  hojaEnCurso = {nodos:[tapa, hoja], t:setTimeout(quitarHoja, 800)};
  requestAnimationFrame(() => requestAnimationFrame(() => {
    hoja.style.transform = `rotateY(${adelante ? -180 : 180}deg)`;
  }));
}

function pintarSemana(){
  const hoy = iso(new Date());
  for (let i = 0; i < 7; i++){
    const d = masDias(lunes, i), f = iso(d), el = document.querySelector(`[data-dia="${i}"]`);
    el.dataset.fecha = f;
    el.querySelector('.num').textContent = d.getDate();
    el.querySelector('.nombre').textContent = DIAS[i];
    el.querySelector('.mes').textContent = MESES[d.getMonth()];
    el.classList.toggle('hoy', f === hoy);
    el.querySelector('.rutinas').innerHTML = rutinaDe(f).map(r => r.marcable
      ? `<span class="rut${rutinaHecha(f, r.id) ? ' hecha' : ''}" data-rut="${r.id}" data-fecha="${f}" title="${r.texto}"><i></i>${r.etiqueta} ${r.corto}</span>`
      : `<span class="rut fija" title="${r.texto}">${r.etiqueta} ${r.corto}</span>`).join('');
    llenar(el.querySelector('.tareas'), tareasDe(f).sort(porHora), true);
  }
  const dom = masDias(lunes, 6);
  const rango = lunes.getMonth() === dom.getMonth()
    ? `${lunes.getDate()} – ${dom.getDate()} ${MESES[dom.getMonth()]}`
    : `${lunes.getDate()} ${MESES[lunes.getMonth()]} – ${dom.getDate()} ${MESES[dom.getMonth()]}`;
  $('#titulo').textContent = `Semana ${semanaISO(lunes)} · ${rango} ${dom.getFullYear()}`;
}

function pintarDia(){
  const d = deIso(diaActual);
  $('#dNum').textContent = d.getDate();
  $('#dNombre').textContent = DIAS[diaSemana(d)];
  $('#dMes').textContent = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
  $('#titulo').textContent = `${DIAS[diaSemana(d)]} ${d.getDate()} de ${MESES[d.getMonth()]} · semana ${semanaISO(d)}`;
  const delDia = tareasDe(diaActual);
  document.querySelectorAll('.franja').forEach(fr => {
    const h = fr.dataset.h, ul = fr.querySelector('.tareas');
    llenar(ul, delDia.filter(t => t.hora && t.hora.slice(0,2) === h).sort(porHora), true);
    rutinaDe(diaActual).filter(r => r.hora.slice(0,2) === h).reverse().forEach(r => ul.prepend(chipRutina(diaActual, r)));
  });
  const enFranja = new Set([...HORAS_IZQ, ...HORAS_DER].map(hh));
  llenar($('.sinhora .tareas'),
    delDia.filter(t => !t.hora || !enFranja.has(t.hora.slice(0,2))).sort(porHora), true);
}

/* ---------- navegación ---------- */
function mover(n){
  if (modo === 'semana'){
    lunes = n === 0 ? lunesDe(new Date()) : masDias(lunes, 7*n);
  } else {
    diaActual = n === 0 ? iso(new Date()) : iso(masDias(deIso(diaActual), n));
    lunes = lunesDe(deIso(diaActual));
  }
  pintar(n || 1);
}
// Entrar en un día es acercarse a su casilla: el horario crece desde ella; al volver, encoge hasta ella
const curva = 'cubic-bezier(.2,.75,.25,1)';
function abrirDia(fecha, celda){
  const r = celda.getBoundingClientRect();
  modo = 'dia'; diaActual = fecha; pintar();
  if (movil()) return;
  const libro = $('#libroDia'), L = libro.getBoundingClientRect();
  Object.assign(libro.style, {transformOrigin:'0 0', transition:'none', opacity:'.25',
    transform:`translate(${r.left - L.left}px,${r.top - L.top}px) scale(${r.width / L.width},${r.height / L.height})`});
  requestAnimationFrame(() => requestAnimationFrame(() => {
    Object.assign(libro.style, {transition:`transform .5s ${curva}, opacity .3s ease-out`, transform:'', opacity:''});
  }));
  setTimeout(() => Object.assign(libro.style, {transition:'', transformOrigin:''}), 550);
}
function volverSemana(){
  const dia = $('#libroDia'), L = dia.getBoundingClientRect();
  const fantasma = movil() ? null : dia.cloneNode(true);
  modo = 'semana'; lunes = lunesDe(deIso(diaActual)); pintar();
  if (!fantasma) return;
  fantasma.removeAttribute('id');
  fantasma.querySelectorAll('[id],[data-zona]').forEach(n => { n.removeAttribute('id'); n.removeAttribute('data-zona'); });
  Object.assign(fantasma.style, {position:'fixed', left:L.left + 'px', top:L.top + 'px', width:L.width + 'px', height:L.height + 'px',
    margin:'0', zIndex:'30', pointerEvents:'none', transformOrigin:'0 0'});
  fantasma.hidden = false;
  document.body.appendChild(fantasma);
  const celda = document.querySelector(`#libroSemana [data-fecha="${diaActual}"]`);
  const r = celda.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    Object.assign(fantasma.style, {transition:`transform .45s ${curva}, opacity .45s ease-in`, opacity:'0',
      transform:`translate(${r.left - L.left}px,${r.top - L.top}px) scale(${r.width / L.width},${r.height / L.height})`});
  }));
  setTimeout(() => fantasma.remove(), 500);
}

$('#ant').onclick = () => mover(-1);
$('#sig').onclick = () => mover(1);
$('#hoy').onclick = () => mover(0);
$('#esqIzq').onclick = () => mover(-1);
$('#esqDer').onclick = () => mover(1);
$('#volver').onclick = volverSemana;

/* ---------- clics ---------- */
function fechaDeZona(zona){
  if (zona.dataset.zona === 'franja' || zona.dataset.zona === 'sinhora') return diaActual;
  return zona.dataset.fecha || '';
}
function alternarRutina(el){
  const f = el.dataset.fecha, id = el.dataset.rut;
  estado.rutina[f] = estado.rutina[f] || {};
  estado.rutina[f][id] = !estado.rutina[f][id];
  rutinaPendiente.add(f + '|' + id);
  guardar(); pintar();
}

document.addEventListener('click', e => {
  const rut = e.target.closest('[data-rut]');
  if (rut){ alternarRutina(rut); return; }
  const chk = e.target.closest('.chk');
  if (chk){
    const t = estado.tareas.find(x => x.id === chk.closest('.tarea').dataset.id);
    t.hecha = !t.hecha;
    // Lo resuelto hoy sin hora se queda en la hora en que se resolvió
    const hoy = iso(new Date());
    if (t.hecha && !t.hora && (!t.fecha || t.fecha === hoy)){
      const n = new Date();
      t.fecha = hoy; t.hora = hh(n.getHours()) + ':' + hh(n.getMinutes());
    }
    tocar(t); guardar(); pintar(); return;
  }
  const li = e.target.closest('.tarea');
  if (li){ abrirEditor(estado.tareas.find(x => x.id === li.dataset.id)); return; }
  const ir = e.target.closest('.ir');
  if (ir){ const celda = ir.closest('.dia'); abrirDia(celda.dataset.fecha, celda); return; }
  const mas = e.target.closest('.mas');
  if (mas){ const z = mas.closest('[data-zona]'); abrirEditor(null, fechaDeZona(z), ''); }
});
document.addEventListener('dblclick', e => {
  const zona = e.target.closest('[data-zona]');
  if (!zona || e.target.closest('.tarea, .rut, .cab')) return;
  abrirEditor(null, fechaDeZona(zona), zona.dataset.zona === 'franja' ? zona.dataset.h + ':00' : '');
});
document.addEventListener('keydown', e => {
  if ($('#velo').classList.contains('abierto')){
    if (e.key === 'Escape') cerrarEditor();
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); guardarEditor(); }
    return;
  }
  if (e.key === 'ArrowLeft') mover(-1);
  if (e.key === 'ArrowRight') mover(1);
  if (e.key === 'Escape' && modo === 'dia') volverSemana();
});

/* ---------- editor ---------- */
let editando = null, fechaNueva = '', temaSel = 'personal';
$('#edTemas').innerHTML = TEMAS.map(t => `<button class="t-${t.id}" data-tema="${t.id}">${t.nombre}</button>`).join('');
$('#edTemas').onclick = e => { const b = e.target.closest('button'); if (b){ temaSel = b.dataset.tema; marcarTema(); $('#edTexto').focus(); } };
const marcarTema = () => document.querySelectorAll('#edTemas button').forEach(b => b.classList.toggle('sel', b.dataset.tema === temaSel));

function abrirEditor(tarea, fecha, hora){
  editando = tarea; fechaNueva = fecha;
  temaSel = tarea ? tarea.tema : ultimoTema;
  let titulo = 'Editar';
  if (!tarea) titulo = fecha ? `${DIAS[diaSemana(deIso(fecha))]} ${+fecha.slice(8)}` : 'Nota sin día';
  $('#edTitulo').textContent = titulo;
  $('#edTexto').value = tarea ? tarea.texto : '';
  $('#edHora').value = tarea ? (tarea.hora || '') : (hora || '');
  $('#edBorrar').style.visibility = tarea ? 'visible' : 'hidden';
  marcarTema();
  $('#velo').classList.add('abierto');
  setTimeout(() => $('#edTexto').focus(), 0);
}
function cerrarEditor(){ $('#velo').classList.remove('abierto'); editando = null; }
function guardarEditor(){
  const texto = $('#edTexto').value.trim();
  const hora = $('#edHora').value || null;
  if (!texto){ cerrarEditor(); return; }
  if (editando){ editando.texto = texto; editando.tema = temaSel; editando.hora = hora; tocar(editando); }
  else {
    estado.tareas.push({id:uid(), texto, hora, tema:temaSel, fecha:fechaNueva || null, hecha:false,
      orden:tareasDe(fechaNueva).length, por:'Lucas', mod:Date.now()});
  }
  ultimoTema = temaSel;
  guardar(); cerrarEditor(); pintar();
}
$('#edGuardar').onclick = guardarEditor;
$('#edCancelar').onclick = cerrarEditor;
$('#edBorrar').onclick = () => {
  estado.tareas = estado.tareas.filter(t => t !== editando);
  estado.borradas.push(editando.id);
  guardar(); cerrarEditor(); pintar();
};
$('#velo').onclick = e => { if (e.target.id === 'velo') cerrarEditor(); };

/* ---------- arrastrar ---------- */
let arrastrando = null, temporizador = null;

function quitarMarca(){
  document.querySelectorAll('.marca').forEach(m => m.remove());
  document.querySelectorAll('.sobre').forEach(z => z.classList.remove('sobre'));
}
function itemsDe(ul){ return [...ul.querySelectorAll('.tarea[data-id]')].filter(li => li.dataset.id !== arrastrando); }
function indice(ul, x, y){
  const horizontal = getComputedStyle(ul).display !== 'block';
  let i = 0;
  for (const it of itemsDe(ul)){
    const r = it.getBoundingClientRect();
    const antes = horizontal
      ? (y > r.bottom || (y >= r.top && x > r.left + r.width/2))
      : y > r.top + r.height/2;
    if (antes) i++;
  }
  return i;
}

document.addEventListener('dragstart', e => {
  const li = e.target.closest('.tarea[data-id]'); if (!li) return;
  arrastrando = li.dataset.id;
  e.dataTransfer.setData('text/plain', arrastrando);
  e.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => li.classList.add('fantasma'));
});
document.addEventListener('dragend', () => {
  arrastrando = null; quitarMarca(); clearTimeout(temporizador);
  document.querySelectorAll('.fantasma').forEach(x => x.classList.remove('fantasma'));
});

document.addEventListener('dragover', e => {
  if (!arrastrando) return;
  const zona = e.target.closest('[data-zona]');
  if (!zona){ quitarMarca(); return; }
  e.preventDefault();
  const ul = zona.querySelector('.tareas');
  const i = indice(ul, e.clientX, e.clientY);
  const marca = ul.querySelector('.marca');
  if (marca && +marca.dataset.i === i) return;
  quitarMarca();
  zona.classList.add('sobre');
  const m = document.createElement('li'); m.className = 'marca'; m.dataset.i = i;
  ul.insertBefore(m, itemsDe(ul)[i] || null);
});
document.addEventListener('drop', e => {
  const zona = e.target.closest('[data-zona]');
  if (!arrastrando || !zona) return;
  e.preventDefault();
  const ul = zona.querySelector('.tareas');
  const marca = ul.querySelector('.marca');
  const ids = itemsDe(ul).map(li => li.dataset.id);
  ids.splice(marca ? +marca.dataset.i : ids.length, 0, arrastrando);

  const t = estado.tareas.find(x => x.id === arrastrando);
  const fecha = fechaDeZona(zona);
  switch (zona.dataset.zona){
    case 'notas':   t.fecha = null; t.hora = null; break;
    case 'dia':     t.fecha = fecha; break;
    case 'sinhora': t.fecha = fecha; t.hora = null; break;
    case 'franja': {
      const h = zona.dataset.h;
      const mismaHora = t.fecha === fecha && t.hora && t.hora.slice(0,2) === h;
      t.fecha = fecha; t.hora = mismaHora ? t.hora : h + ':00';
    }
  }
  ids.forEach((id, n) => { const x = estado.tareas.find(y => y.id === id); x.orden = n; tocar(x); });
  guardar(); quitarMarca(); pintar();
});

// Arrastrar sobre la esquina pasa la página
[['#esqIzq', -1], ['#esqDer', 1]].forEach(([sel, n]) => {
  const esq = $(sel);
  esq.addEventListener('dragenter', () => {
    if (!arrastrando) return;
    esq.classList.add('tentando');
    clearTimeout(temporizador);
    temporizador = setTimeout(function paso(){ mover(n); temporizador = setTimeout(paso, 900); }, 650);
  });
  esq.addEventListener('dragover', e => { if (arrastrando) e.preventDefault(); });
  esq.addEventListener('dragleave', () => { esq.classList.remove('tentando'); clearTimeout(temporizador); });
  esq.addEventListener('drop', e => { e.preventDefault(); esq.classList.remove('tentando'); clearTimeout(temporizador); });
});

/* ---------- copia de seguridad ---------- */
$('#exportar').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(estado, null, 2)], {type:'application/json'}));
  a.download = `agenda-${iso(new Date())}.json`;
  a.click();
};
$('#importar').onclick = () => $('#fichero').click();
$('#fichero').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (Array.isArray(s.tareas)){ estado = completar(s); estado.tareas.forEach(tocar); guardar(); pintar(); }
  } catch(err){ console.error('Copia no válida', err); }
  e.target.value = '';
};

/* ---------- conexión con la nube ---------- */
$('#nube').onclick = () => {
  if (token){ sincronizar(); return; }
  $('#veloToken').classList.add('abierto'); setTimeout(() => $('#tokTexto').focus(), 0);
};
$('#tokCancelar').onclick = () => $('#veloToken').classList.remove('abierto');
$('#tokGuardar').onclick = async () => {
  token = $('#tokTexto').value.trim();
  try { await leerNube(); } catch(e){ token = ''; $('#tokError').textContent = 'No me deja leer la agenda con ese token.'; return; }
  try { localStorage.setItem(CLAVE_TOKEN, token); } catch(e){}
  $('#veloToken').classList.remove('abierto');
  pendiente = estado.tareas.length > 0;
  sincronizar();
};
// Conectar abriendo la agenda con #token=… (el fragmento no sale del navegador); se guarda y se borra de la barra
const enlace = location.hash.match(/token=([^&]+)/);
if (enlace){
  token = decodeURIComponent(enlace[1]);
  try { localStorage.setItem(CLAVE_TOKEN, token); } catch(e){}
  history.replaceState(null, '', location.pathname);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
setInterval(sincronizar, 60000);

pintar();
avisoNube();
sincronizar();
</script>
